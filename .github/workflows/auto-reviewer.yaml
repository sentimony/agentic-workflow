name: Claude Review

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: false
      pr_number:
        description: Legacy PR number
        required: false

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: read
  statuses: write

jobs:
  auto_review:
    uses: sentimony/github-workflows/.github/workflows/auto-reviewer.yaml@e589d7871bed62551a6a7624c3f28c5cac49a1e7
    with:
      required-ci-job: validate
      pr: ${{ inputs.pr || '' }}
      pr_number: ${{ inputs.pr_number || '' }}
    secrets:
      YNGWALD_PR_TOKEN: ${{ secrets.YNGWALD_PR_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
