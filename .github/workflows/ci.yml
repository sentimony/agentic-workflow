name: CI

on:
  workflow_dispatch:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Test review helpers
        run: |
          python3 scripts/check_plugin_layout.py --self-test
          python3 -m unittest discover -s scripts -p 'test_plugin_layout.py'
          python3 -m unittest discover -s scripts -p 'test_claude_review.py'
          python3 -m unittest discover -s skills/cr-received/scripts -p 'test_*.py'
          python3 -m unittest discover -s skills/cr-request/scripts -p 'test_*.py'

      - name: Test delivery helpers
        run: |
          python3 - <<'PY'
          import sys, unittest

          suites = (
              ("skills/verify/scripts", "test_dependency_isolation.py"),
              ("skills/finalize/scripts", "test_delivery_gate.py"),
              ("skills/finalize/scripts", "test_cleanup_guard.py"),
              ("skills/implement/scripts", "test_post_merge_evidence.py"),
              ("scripts", "test_delivery_integration.py"),
              ("skills/resolve-issue/scripts", "test_*.py"),
          )
          for directory, pattern in suites:
              suite = unittest.TestLoader().discover(directory, pattern=pattern)
              count = suite.countTestCases()
              if count == 0:
                  sys.exit(f"No tests discovered: {directory}/{pattern}")
              print(f"Delivery suite: {directory}/{pattern}: {count} tests", flush=True)
              if not unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful():
                  sys.exit(1)
          PY

      - name: Validate SKILL.md frontmatter
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          errors = []
          skills = sorted(pathlib.Path("skills").glob("*/SKILL.md"))
          if not skills:
              errors.append("no skills/*/SKILL.md found")
          for skill_md in skills:
              m = re.match(r"^---\n(.*?)\n---\n", skill_md.read_text(encoding="utf-8"), re.DOTALL)
              if not m:
                  errors.append(f"{skill_md}: missing YAML frontmatter")
                  continue
              fm = m.group(1)
              name = re.search(r"^name:\s*(\S+)\s*$", fm, re.MULTILINE)
              if not name or name.group(1) != skill_md.parent.name:
                  errors.append(f"{skill_md}: name must equal directory '{skill_md.parent.name}'")
              if not re.search(r"^description:\s*\S", fm, re.MULTILINE):
                  errors.append(f"{skill_md}: missing 'description'")
              # Only the version key inside the metadata block counts, not any other nested key.
              # The same metadata regex is in the README check below; change both together.
              metadata = re.search(r"^metadata:[ \t]*\n((?:[ \t]+.*\n?)*)", fm + "\n", re.MULTILINE)
              version = metadata and re.search(r'^  version:\s*"(\d+\.\d+\.\d+)"\s*$', metadata.group(1), re.MULTILINE)
              if not version:
                  errors.append(f"{skill_md}: metadata.version must be plain semver X.Y.Z")
              if not re.search(r"^license:\s*MIT\s*$", fm, re.MULTILINE):
                  errors.append(f"{skill_md}: license must be MIT")
              if not (skill_md.parent / "LICENSE").is_file():
                  errors.append(f"{skill_md.parent}: missing LICENSE")
              changelog = skill_md.parent / "CHANGELOG.md"
              if not changelog.is_file():
                  errors.append(f"{skill_md.parent}: missing CHANGELOG.md")
              elif version:
                  top = re.search(r"^## \[(\d+\.\d+\.\d+)\]", changelog.read_text(encoding="utf-8"), re.MULTILINE)
                  if not top or top.group(1) != version.group(1):
                      errors.append(f"{changelog}: newest entry {top and top.group(1)} != metadata.version {version.group(1)}")
              hint = re.search(r"^argument-hint:(.*)$", fm, re.MULTILINE)
              if hint:
                  value = hint.group(1).strip().strip("\"'").strip()
                  depth = 0
                  for ch in value:
                      depth += {"[": 1, "]": -1}.get(ch, 0)
                      if depth < 0:
                          break
                  if not value or value[0] in "|>" or depth != 0 or value.count("<") != value.count(">"):
                      errors.append(f"{skill_md}: argument-hint must be a non-empty single line with balanced [] and <>")

          for err in errors:
              print(f"::error::{err}")
          sys.exit(1 if errors else 0)
          PY

      - name: Check manifests, no own marketplace, and README versions
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys

          errors = []
          root = pathlib.Path(".")
          load = lambda path: json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
          readme = pathlib.Path("README.md").read_text(encoding="utf-8")
          # The repository version in README is the release every plugin tracks.
          release = re.search(r"^Version: `v(\d+\.\d+\.\d+)`$", readme, re.MULTILINE)
          release = release and release.group(1)
          if not release:
              errors.append("README.md: missing 'Version: `vX.Y.Z`' line")

          import subprocess
          subprocess.run([sys.executable, "scripts/check_plugin_layout.py"], check=True)
          plugin = load("plugin.json")
          if plugin.get("version") != release:
              errors.append("plugin.json version != README version")
          if not re.search(rf"^\| \[agentflow\]\([^)]*\) \| {re.escape(str(release))} \|", readme, re.MULTILINE):
              errors.append("README.md: Plugins table row for agentflow missing or stale")
          for market in (".claude-plugin/marketplace.json", ".agents/plugins/marketplace.json"):
              if pathlib.Path(market).exists():
                  errors.append(f"{market}: marketplace belongs in sentimony/marketplace")

          for skill_md in root.glob("skills/*/SKILL.md"):
              fm = re.match(r"^---\n(.*?)\n---\n", skill_md.read_text(encoding="utf-8"), re.DOTALL)
              # Same metadata regex as in the frontmatter check above; change both together.
              metadata = fm and re.search(r"^metadata:[ \t]*\n((?:[ \t]+.*\n?)*)", fm.group(1) + "\n", re.MULTILINE)
              version = metadata and re.search(r'^  version:\s*"([^"]+)"', metadata.group(1), re.MULTILINE)
              skill = skill_md.parent.name
              if version and not re.search(rf"^\| \[{re.escape(skill)}\]\([^)]*\) \| {re.escape(version.group(1))} \|", readme, re.MULTILINE):
                  errors.append(f"README.md: Skills table row for {skill} {version.group(1)} missing or stale")

          for err in errors:
              print(f"::error::{err}")
          sys.exit(1 if errors else 0)
          PY

      - name: Check for hidden Unicode and typographic dashes
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys, unicodedata

          # Bidi controls, zero-width and invisible format characters, BOM, and soft hyphen.
          invisible = set(range(0x202A, 0x202F)) | set(range(0x2066, 0x206A)) | set(range(0x200B, 0x2010)) \
              | set(range(0x2060, 0x2065)) | {0x00AD, 0x061C, 0x180E, 0xFEFF}

          # Prose uses the plain hyphen only: every other dash punctuation (Pd) and the minus sign.
          def forbidden(ch):
              return ord(ch) in invisible or ord(ch) == 0x2212 or (ch != "-" and unicodedata.category(ch) == "Pd")

          files = subprocess.run(["git", "ls-files", "-z"], check=True, capture_output=True).stdout.decode().split("\0")
          errors = 0
          for name in filter(None, files):
              try:
                  text = pathlib.Path(name).read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for number, line in enumerate(text.splitlines(), 1):
                  hits = sorted({f"U+{ord(ch):04X}" for ch in line if forbidden(ch)})
                  if hits:
                      print(f"::error file={name},line={number}::forbidden character {', '.join(hits)}")
                      errors += 1
          sys.exit(1 if errors else 0)
          PY
