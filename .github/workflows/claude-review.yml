name: Claude review

# Posts a cr-request PR review as yngwald on each open, non-draft, same-repo PR whose head has a
# green CI run: automatically on the first head and on new heads after a review with Critical or
# Important findings (at most 3 reviews), and on every request for yngwald or dispatch. The agent
# reviews with a read-only GITHUB_TOKEN and writes the body and the inline comments to files; the
# publish job validates them, and only its `post` step gets the yngwald PAT. That holds for the main
# copy of this file: pull_request runs use the PR branch's copy, so anyone who can push a branch can
# reach the PAT. The checks cover the body's structure and token-like strings, not its prose; the
# `Claude review` status is advisory, not a required check.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  # A PR opened, reopened, or marked ready after its CI went green gets no new CI run.
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number
        required: true

# One group per head SHA, so the gate that posts the latest `pending` status for a head is also the
# run whose review survives, and a late CI run for an older head cannot cancel the review of a newer
# one. The review job has a per-PR group on top: a newer head that passed its gate cancels the older
# head's running review. A review request for someone else gets its own group and cancels nothing.
# A workflow_dispatch run knows only the PR number, so it gets its own group here and meets an
# event-driven run for the same head only in the review job's group; status ownership in publish
# then decides which result is reported.
concurrency:
  group: >-
    claude-review-${{ github.event.pull_request.head.repo.full_name || github.event.workflow_run.head_repository.full_name || github.repository }}-${{
    github.event.workflow_run.head_sha || github.event.pull_request.head.sha || format('pr-{0}', inputs.pr_number) }}${{
    github.event.action == 'review_requested' && github.event.requested_reviewer.login != 'yngwald'
    && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions: {}

jobs:
  gate:
    name: Review gate
    # Failed CI runs pass too: the gate turns a pending request's status into `error` and skips.
    if: github.event.action != 'review_requested' || github.event.requested_reviewer.login == 'yngwald'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      review: ${{ steps.gate.outputs.review }}
      number: ${{ steps.gate.outputs.number }}
      base_sha: ${{ steps.gate.outputs.base_sha }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REVIEWER: yngwald
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          EVENT_PR: ${{ github.event.pull_request.number || inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          CONTEXT: Claude review
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          post_status() {
            gh api "repos/$REPO/statuses/$head_sha" -f state="$1" -f description="$2" \
              -f context="$CONTEXT" -f target_url="$RUN_URL" > /dev/null
          }

          skip() {
            echo "Skip: $1" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "review=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # For skips that end a requested review: a "waiting for green CI" status would stay pending.
          skip_final() {
            [ -n "${head_sha:-}" ] || skip "$1"
            waiting=$(gh api "repos/$REPO/commits/$head_sha/status?per_page=100" \
              --jq '[.statuses[] | select(.context == env.CONTEXT)][0] | select(.state == "pending")
                | (.description // "") | startswith("Review requested; waiting")')
            [ "$waiting" != true ] || post_status error "Not reviewed: $1"
            skip "$1"
          }

          if [ -n "$RUN_SHA" ]; then
            [ "$RUN_HEAD_REPO" = "$REPO" ] || skip "CI run from a fork"
            # CI runs on push, so its run carries no PR; find the open PR by commit.
            number=$(gh api "repos/$REPO/commits/$RUN_SHA/pulls" \
              --jq "[.[] | select(.state == \"open\" and .head.sha == \"$RUN_SHA\")][0].number // empty")
          else
            number="$EVENT_PR"
          fi
          [ -z "$number" ] || [[ "$number" =~ ^[0-9]+$ ]] || skip "invalid PR number '$number'"
          # The run's commit is no open PR's head any more; a waiting status on it is resolved.
          [ -n "$number" ] || { head_sha="$RUN_SHA"; skip_final "no open PR for $RUN_SHA"; }

          pr=$(gh api "repos/$REPO/pulls/$number")
          head_sha=$(jq -r .head.sha <<< "$pr")
          base_sha=$(jq -r .base.sha <<< "$pr")
          [ "$(jq -r .state <<< "$pr")" = open ] || skip_final "PR #$number is not open"
          [ "$(jq -r .draft <<< "$pr")" = false ] || skip_final "PR #$number is a draft"
          [ "$(jq -r .head.repo.full_name <<< "$pr")" = "$REPO" ] || skip "PR #$number is from a fork"
          [ "$(jq -r .user.type <<< "$pr")" != Bot ] || skip_final "PR #$number is from a bot"
          [ "$(jq -r .user.login <<< "$pr")" != "$REVIEWER" ] || skip_final "PR #$number is by $REVIEWER"
          jq -e '.labels | map(.name) | index("skip-auto-review") | not' <<< "$pr" > /dev/null \
            || skip_final "PR #$number has the skip-auto-review label"
          [ -z "$RUN_SHA" ] || [ "$RUN_SHA" = "$head_sha" ] || skip "PR #$number moved on from $RUN_SHA"
          requested=$(jq --arg r "$REVIEWER" '[.requested_reviewers[].login] | index($r) != null' <<< "$pr")

          # Runs are listed newest first; the per-workflow endpoint answers 404 until ci.yml has run.
          ci=$(gh api "repos/$REPO/actions/runs?head_sha=$head_sha&event=push" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")][0]
              | if . == null then "none" elif .status != "completed" then .status else .conclusion end')
          if [ "$ci" != success ]; then
            if [ "$requested" = true ]; then
              case "$ci" in
                none|queued|in_progress|waiting|requested|pending)
                  post_status pending "Review requested; waiting for green CI" ;;
                *) post_status error "Review requested; CI is $ci, the review waits for a green run" ;;
              esac
            fi
            skip "CI on $head_sha is $ci"
          fi

          # A request for yngwald (pending, or this event) and a dispatch always review. An automatic
          # trigger reviews the first head, and a new head after a review with Critical or Important
          # findings while the PR has fewer than 3 reviews from yngwald.
          if [ "$requested" != true ] && [ "$EVENT_ACTION" != review_requested ] \
            && [ "$EVENT_NAME" != workflow_dispatch ]; then
            # One JSON object per review, slurped below: --paginate with --jq applies the filter per page.
            marked=$(gh api --paginate "repos/$REPO/pulls/$number/reviews" \
              --jq '.[] | select(.user.login == env.REVIEWER) | .body |= ((. // "") | gsub("\r"; ""))
                | select(.body | startswith("<!-- claude-review sha="))
                | .sha = (.body | split("\n")[0] | ltrimstr("<!-- claude-review sha=") | rtrimstr(" -->"))
                | select(.sha | test("^[0-9a-f]{40}$"))
                | {submitted_at, sha, body}
                | tojson')
            total=$(jq -s length <<< "$marked")
            if [ "$total" -gt 0 ]; then
              last_sha=$(jq -rs 'sort_by(.submitted_at) | last | .sha' <<< "$marked")
              # The lines above the first ### heading and the Summary section, outside <details> blocks,
              # as publish reads them: the table sits above any heading now and under ### Summary before.
              last_summary=$(jq -rs 'sort_by(.submitted_at) | last | .body' <<< "$marked" \
                | awk '/^<details>/ {skip = 1} /^<\/details>/ {skip = 0; next} skip {next}
                  /^### / {on = ($0 ~ /^### Summary[[:space:]]*$/); seen = 1; next} on || !seen')
              # The one-row table: the data row two lines under its header, the counts from column 5 or,
              # in reviews posted before the verdicts moved first, column 2. Rows of `Severity | Count`,
              # the vertical table of older reviews, still count for open PRs.
              blocking=$(awk -F'|' '
                row == 2 {
                  if ($col ~ /^ *[0-9]+ *$/ && $(col + 1) ~ /^ *[0-9]+ *$/) s += $col + $(col + 1)
                  row = 0; next
                }
                row == 1 { row = 2; next }
                /^\| *Intent *\| *System *\| *Craft *\| *Critical *\| *Important *\|/ { row = 1; col = 5; next }
                /^\| *Critical *\| *Important *\| *Minor *\|/ { row = 1; col = 2; next }
                /^\| *(Critical|Important) *\| *[0-9]+ *\|/ { s += $3 }
                END { print s + 0 }' <<< "$last_summary")
              [ "$last_sha" != "$head_sha" ] || skip_final "PR #$number already has a review of $head_sha"
              [ "$blocking" -gt 0 ] || skip_final "the latest review of PR #$number has no Critical or Important findings"
              [ "$total" -lt 3 ] || skip_final "PR #$number has $total reviews from $REVIEWER; request $REVIEWER for another"
            fi
          fi

          post_status pending "Claude review in progress"

          echo "Review PR #$number at $head_sha" | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo "review=true"
            echo "number=$number"
            echo "base_sha=$base_sha"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"

  review:
    name: Claude review
    needs: gate
    if: needs.gate.outputs.review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only runs that passed the gate get here, and the gate skips a run whose head the PR moved on
    # from, so the review that starts last is for the newest head and cancels the older one.
    concurrency:
      group: claude-review-job-pr-${{ needs.gate.outputs.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    # The agent can write the body file, so publish takes the version from here, not the artifact.
    outputs:
      version: ${{ steps.skill.outputs.version }}
    env:
      NUMBER: ${{ needs.gate.outputs.number }}
      HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      # The agent gets no git diff, log, or show: they accept --output=<path>, which could write
      # outside .auto-review/. The target is prepared here and handed over as files instead.
      - name: Prepare review target
        # bash -eo pipefail: a failing git diff feeding the base-copy loop must fail the step.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.gate.outputs.base_sha }}
        run: |
          out=.auto-review/target
          # The path is reserved: a PR that tracks anything under it, symlinks included, fails here.
          # rm -rf then clears only untracked leftovers, and every write below lands in a fresh directory.
          if [ -n "$(git ls-files .auto-review)" ]; then
            echo "::error::.auto-review/ is reserved for the review job; remove it from the PR"
            exit 1
          fi
          rm -rf .auto-review
          mkdir -p "$out/base"
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          {
            echo "Repository root: $GITHUB_WORKSPACE ($GITHUB_REPOSITORY)"
            echo "Branch or worktree: detached checkout of PR #$NUMBER"
            echo "Boundary: range"
            echo "Base: $BASE_SHA"
            echo "Effective base: $merge_base"
            echo "Head: $HEAD_SHA"
            echo "Tree: $(git rev-parse "$HEAD_SHA^{tree}")"
            echo "Included paths: every path in stat.txt"
            echo "Excluded paths and reason: none"
            echo "Uncommitted state: none"
            echo "Captured at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$out/identity.txt"
          git log --format='%h %H %s' "$merge_base..$HEAD_SHA" > "$out/log.txt"
          # The agent has no gh: gh --jq can read its environment.
          gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json title,body,author,baseRefName,headRefName,url,reviews,comments \
            --jq '(.reviews, .comments) |= map(select(.authorAssociation | IN("OWNER", "MEMBER", "COLLABORATOR")))' \
            > "$out/pr.json"
          git diff --no-ext-diff --no-textconv --stat "$merge_base" "$HEAD_SHA" > "$out/stat.txt"
          git diff --no-ext-diff --no-textconv "$merge_base" "$HEAD_SHA" > "$out/diff.patch"
          # Base copies of modified, deleted, and type-changed files; the checkout holds the head side.
          git diff -z --name-only --no-renames --diff-filter=MDT "$merge_base" "$HEAD_SHA" |
            while IFS= read -r -d '' path; do
              mkdir -p "$out/base/$(dirname -- "$path")"
              git show "$merge_base:$path" > "$out/base/$path"
            done
          test -s "$out/diff.patch" || { echo "::error::empty diff for $merge_base..$HEAD_SHA"; exit 1; }
          # Claude Code loads project config from the PR code, nested .claude/ dirs and CLAUDE.local.md
          # files included, and the action restores it from base only on pull_request events. Their
          # changes stay in diff.patch. A nested .mcp.json does not load (probed on Claude Code 2.1.310).
          find . -path ./.git -prune -o \( -name .claude -o -name CLAUDE.local.md \) -prune -exec rm -rf {} +
          rm -f .mcp.json .claude.json

      # User scope: the prepare step removed every .claude/ from the checkout, and the action restores
      # .claude/ from the base branch only on pull_request events, not on workflow_run or dispatch.
      # The reviewer skill comes from a released tag, never from the PR head under review: the newest
      # vX.Y.Z tag, so the signature names the latest released cr-request, unless the
      # REVIEW_SKILLS_REF repo variable pins a full commit SHA.
      - name: Install cr-request skill
        id: skill
        env:
          SOURCE: https://github.com/sentimony/agentic-workflow
          REVIEW_SKILLS_REF: ${{ vars.REVIEW_SKILLS_REF }}
        run: |
          if [ -n "$REVIEW_SKILLS_REF" ]; then
            [[ "$REVIEW_SKILLS_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::REVIEW_SKILLS_REF must be a full commit SHA"; exit 1; }
            ref="$REVIEW_SKILLS_REF"
          else
            ref=$(git ls-remote --tags --refs "$SOURCE" \
              | sed -nE 's#^[0-9a-f]{40}[[:space:]]+(refs/tags/v[0-9]+\.[0-9]+\.[0-9]+)$#\1#p' | sort -V | tail -n 1)
            test -n "$ref" || { echo "::error::No vX.Y.Z tag in $SOURCE"; exit 1; }
          fi
          echo "cr-request source: $ref"
          git init -q "$RUNNER_TEMP/aw"
          git -C "$RUNNER_TEMP/aw" fetch -q --depth 1 "$SOURCE" "$ref"
          git -C "$RUNNER_TEMP/aw" checkout -q FETCH_HEAD
          mkdir -p ~/.claude/skills .auto-review
          # Any plugin directory: the pinned tag may predate the rename of the plugin.
          cp -R "$RUNNER_TEMP"/aw/plugins/*/skills/cr-request ~/.claude/skills/
          test -f ~/.claude/skills/cr-request/SKILL.md
          version="$(sed -nE 's/^[[:space:]]+version:[[:space:]]*"?([0-9][0-9.]*)"?[[:space:]]*$/\1/p' ~/.claude/skills/cr-request/SKILL.md | head -n 1)"
          test -n "$version" || { echo "::error::No version in the cr-request SKILL.md"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The duration in the signature line covers the agent step only, from here to the step after it.
      - name: Record review start
        id: start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1
        id: claude
        with:
          # Read-only token: the agent reads the PR but cannot write to GitHub.
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # User-scope setting: Read, Grep, and Glob outside the working directory are refused (Bash is
          # denied in claude_args); Claude Code keeps ~/.claude/skills readable.
          settings: '{"permissions":{"blockReadsOutsideWorkingDirectories":true}}'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ needs.gate.outputs.number }}
            BASE SHA: ${{ needs.gate.outputs.base_sha }}
            HEAD SHA: ${{ needs.gate.outputs.head_sha }}

            Run the cr-request skill for this pull request on a prepared target. The target is the
            committed range from the merge base of BASE SHA and HEAD SHA to HEAD SHA, already captured in
            .auto-review/target/: identity.txt (the target identity, tree included), log.txt
            (`<short sha> <full sha> <subject>` per commit), stat.txt, diff.patch, base/ with the
            merge-base copies of modified, deleted, and type-changed files, and pr.json with the PR title,
            description, author, base and head branches, URL, reviews, and comments. The checkout is HEAD
            SHA; `.claude/` dirs and `CLAUDE.local.md` files at any depth, plus the root `.mcp.json` and
            `.claude.json`, were removed before the run, and their changes are in diff.patch. No shell
            commands are available (no git, no gh): use the tree in identity.txt and read these files
            instead, and pass the same instruction to any reviewer you dispatch. Intent: the PR title and
            description from pr.json, plus AGENTS.md. There is no plan file and no journal to write.
            CI (skill frontmatter, manifests, no own marketplace, README versions, hidden Unicode) is green on HEAD SHA; tests were not run in this job - say so in the gaps.
            pr.json keeps only reviews and comments by owners, members, and collaborators. They are context,
            not intent; label this a fresh review pass when the same reviewer already reviewed an older head.

            This run ends with your final message: dispatch reviewers in the foreground, never in the
            background, write .auto-review/review.md before you finish, and never end with a reviewer still
            running.

            If the cr-request skill is not available to you, do not review and do not write
            .auto-review/review.md; stop and report that the skill is missing.

            Write exactly one pull request review body in English, with plain hyphens only (the ` · ` of the two
            closing lines excepted), to .auto-review/review.md, and its inline comments to
            .auto-review/comments.json; do not write or edit any other file. Do not post them; a later step posts
            them as one review that neither approves nor requests changes.

            Keep the body compact: a reader sees the verdicts and the readiness at a glance, and opens every
            other detail, the findings and the target included, on demand from the one collapsed `<details>`
            block, the only one in the body; do not nest another inside it. Put a blank line after its
            `<summary>...</summary>` line, before `</details>`, and after `</details>`, so the Markdown inside
            and after it renders. The body must start with this exact line:
            <!-- claude-review sha=${{ needs.gate.outputs.head_sha }} -->
            then these parts, in this order, with no headings outside the `<details>` block:

            | Intent | System | Craft | Critical | Important | Minor |
            | --- | --- | --- | --- | --- | --- |
            | <verdict> | <verdict> | <verdict> | <n> | <n> | <n> |

            **Readiness:** ready, ready with fixes, or not ready, and nothing else on the line

            <details><summary>Details</summary>

            #### Findings

            One line per finding, most severe first:
            - **<severity>** <id> [`<path>:<line>`](https://github.com/${{ github.repository }}/blob/${{ needs.gate.outputs.head_sha }}/<path>#L<line>) <title>

            then each finding with severity, confidence, file:line, impact, and evidence, and an optional
            suggestion. Omit this part when there are no findings.

            #### Target

            **Target:** PR [#${{ needs.gate.outputs.number }}](<PR URL from pr.json>) (`<head branch>` -> `<base branch>`)

            The target identity (base, head, tree, uncommitted state, excluded paths). **Range:** the reviewed
            range as a compare link with short SHAs, followed by the number of files and lines from the last line
            of .auto-review/target/stat.txt:
            [`<base7>...<head7>`](https://github.com/${{ github.repository }}/compare/<BASE SHA>...<HEAD SHA>)
            **Commits:** the commits from .auto-review/target/log.txt, one line each, as
            - [`<short sha>`](https://github.com/${{ github.repository }}/commit/<full sha>) <subject>
            and after 20 commits `and <n> more`. **Coverage:** how the review ran, the files read, what was
            skipped, and the intent sources.

            #### Axis verdicts

            The reason for the readiness in one line, then one bullet per axis with its verdict and reasons; on
            a fresh review pass, the status of each finding of the previous yngwald review after them.

            #### Set aside, open questions, and review gaps

            The set-aside list, open questions, and review gaps.

            </details>

            Each verdict is PASS, FINDINGS, or UNASSESSED. Use only the severities Critical, Important, and Minor;
            the counts must match the findings, and zero findings means zeros.

            .auto-review/comments.json is a JSON array with one object per finding that points at a line the PR
            adds or keeps in diff.patch, so it shows next to the code: {"path": "<repo path>", "line": <line
            number in the HEAD SHA file>, "body": "<Markdown>"}. The comment body starts with
            `**<severity>** <id> - <title>`, then the impact and the evidence in a few lines, and an optional
            suggestion. A finding with no such line stays in the review body only; write `[]` when none has one.
            A later step drops a comment whose line is outside the diff.

            Never copy a token or secret into the body or the comments. Write GitHub logins, team names, and any
            other text that starts with @ inside backticks, so the posted review notifies nobody.
            End the body with the two CI closing lines that the cr-request skill states: the signature line
            below, backticks included, then the `Next step` line as the very last line. In that line each skill
            is inline code with a leading slash, its arguments inside the code span, and ` · ` goes before a
            reason; pick the line by the result:
            - Findings, or a previous yngwald finding left not addressed, with no reason:
              `` Next step: `/cr-received PR #${{ needs.gate.outputs.number }}` ``
            - No findings (a `Verify` line names a fingerprint without the record host, never this Tree):
              ``Next step: `/verify <plan path>` -> `/finalize` squash``, where the plan path is the plan
              the PR description names, else a file under `docs/plans/` in diff.patch; with no plan found,
              ``Next step: `/verify` -> `/finalize` squash``. `squash` recommends the merge method.
            - Any other result: ``Next step: `/<skill>` · <reason>``; `none` stays plain text
              (`Next step: none · <reason>`).
            The publish step cuts the reason after ` · ` and leaves the first two forms whole. The ` · ` and
            ` -> ` in these two lines are the required format, not dashes. The skill writes the signature without
            a duration; the workflow appends the review duration to it afterwards as ` · In <m> min <s> sec`.
            The signature line:
            Reviewed with: `/cr-request` ${{ steps.skill.outputs.version }} skill
          # Reads stay in the workspace and the installed skill, so injected PR text cannot steer the agent
          # to runner files or /proc and copy a token into the body. Grep and Glob are allowed bare: the
          # blockReadsOutsideWorkingDirectories setting, not a path rule, refuses them outside the
          # workspace. Write follows the Edit rules for the body and comments files. Bash is denied,
          # built-in read-only commands included: any allowed command can echo an expanded variable. .git/
          # is denied for Read, Grep, and Glob: .git/config holds the action's token in the origin URL.
          claude_args: >-
            --model ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-opus-5-5' }}
            --max-turns 60
            --allowedTools "Skill,Agent,Task,Grep,Glob,Read(./**),Read(~/.claude/skills/**),Edit(./.auto-review/review.md),Write(./.auto-review/review.md),Edit(./.auto-review/comments.json),Write(./.auto-review/comments.json)"
            --disallowedTools "Bash,Read(./.git/**)"

      # The duration is the agent step's wall time; the agent cannot measure it. Only the signature line
      # among the last two non-blank lines is rewritten, so a quoted signature higher up stays as written;
      # anything the agent put after the signature and a space there is replaced by the measured duration.
      # Under a minute it reads `In 0 min 42 sec`.
      - name: Add review duration
        env:
          START: ${{ steps.start.outputs.epoch }}
          SIGNATURE: 'Reviewed with: `/cr-request` ${{ steps.skill.outputs.version }} skill'
          SEP: ' · '
        run: |
          body=.auto-review/review.md
          [ -f "$body" ] || exit 0
          elapsed=$(( $(date +%s) - START ))
          export DURATION="In $(( elapsed / 60 )) min $(( elapsed % 60 )) sec"
          tmp="$(mktemp)"
          # Two passes over the body: the first finds the last two non-blank lines, the second rewrites.
          awk '
            { sub(/\r$/, "") }
            NR == FNR { if ($0 !~ /^[[:space:]]*$/) { prev = last; last = FNR } next }
            FNR == prev || FNR == last {
              line = $0; sub(/[[:space:]]+$/, "", line)
              sig = ENVIRON["SIGNATURE"]; sep = ENVIRON["SEP"]
              rest = substr(line, length(sig) + 1)
              if (substr(line, 1, length(sig)) == sig && (rest == "" || substr(rest, 1, 1) == " ")) {
                $0 = sig sep ENVIRON["DURATION"]
              }
            }
            { print }
          ' "$body" "$body" > "$tmp"
          mv "$tmp" "$body"
          echo "Review duration: $DURATION"

      # GitHub rejects a whole review when one inline comment points outside the diff, so only comments
      # on a head-side line of a diff.patch hunk stay; the rest of the findings live in the body. The
      # agent chooses the comments: the log gets counts only. -I keeps a json.py or re.py at the root of
      # the PR checkout from shadowing the standard library.
      - name: Check inline comments
        run: |
          python3 -I - <<'PY'
          import json, pathlib, re

          root = pathlib.Path(".auto-review")
          out = root / "comments.json"
          if not (root / "review.md").is_file():
              out.unlink(missing_ok=True)
              raise SystemExit(0)

          lines, path, old_left, new_left, right = {}, None, 0, 0, 0
          for raw in (root / "target/diff.patch").read_text(encoding="utf-8", errors="replace").split("\n"):
              if old_left > 0 or new_left > 0:
                  if raw.startswith("+"):
                      lines.setdefault(path, set()).add(right)
                      right, new_left = right + 1, new_left - 1
                  elif raw.startswith("-"):
                      old_left -= 1
                  elif not raw.startswith("\\"):
                      lines.setdefault(path, set()).add(right)
                      right, old_left, new_left = right + 1, old_left - 1, new_left - 1
                  continue
              if raw.startswith("diff --git "):
                  path = None
              elif raw.startswith("+++ "):
                  # A quoted path (special characters) gets no comments; git ends a path with a
                  # space with a TAB.
                  path = raw[6:].rstrip("\t") if raw.startswith("+++ b/") else None
              else:
                  hunk = re.match(r"@@ -\d+(?:,(\d+))? \+(\d+)(?:,(\d+))? @@", raw)
                  if hunk:
                      old_left = int(hunk.group(1) or 1)
                      right = int(hunk.group(2))
                      new_left = int(hunk.group(3) or 1)

          try:
              proposed = json.loads(out.read_text(encoding="utf-8")) if out.is_file() else []
          except (ValueError, UnicodeDecodeError):
              proposed = None
          if not isinstance(proposed, list):
              print("::warning::comments.json is not a JSON array; no inline comments")
              proposed = []
          kept = [
              {"path": c["path"], "line": c["line"], "body": c["body"].strip()}
              for c in proposed
              if isinstance(c, dict) and isinstance(c.get("path"), str) and type(c.get("line")) is int
              and isinstance(c.get("body"), str) and 0 < len(c["body"].strip()) <= 8000
              and c["line"] in lines.get(c["path"], ())
          ][:30]
          out.write_text(json.dumps(kept), encoding="utf-8")
          print(f"Inline comments: {len(kept)} kept of {len(proposed)}")
          PY

      # The action hides the agent's output: list the paths it read and the calls the permission rules
      # refused (paths and commands only), and the result when it wrote no body.
      - name: Show file access and why no review was written
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          [ -f "$EXECUTION_FILE" ] || exit 0
          [ -f .auto-review/review.md ] \
            || echo "::warning::The agent finished without .auto-review/review.md; its result follows"
          # The agent chooses these strings: fields print as JSON, one per line, and the runner ignores
          # workflow commands until the random token ends the block.
          stop="$(openssl rand -hex 16)"
          echo "::stop-commands::$stop"
          trap 'echo "::$stop::"' EXIT
          echo "Read and search calls:"
          jq -r '[if type == "array" then .[] else . end | select(.type? == "assistant") | .message.content[]?
            | select(.type? == "tool_use" and (.name == "Read" or .name == "Grep" or .name == "Glob"))
            | "\(.name) \(.input | {file_path, path, pattern, glob} | with_entries(select(.value != null)) | tojson)"]
            | unique[]' "$EXECUTION_FILE" || true
          echo "Permission denials:"
          jq -r '[if type == "array" then .[] else . end | select(.type? == "result")] | last
            | (.permission_denials // [])[]
            | "\(.tool_name) \(.tool_input | {file_path, path, pattern, glob, command} | with_entries(select(.value != null))
                | if .command then .command |= .[0:160] else . end | tojson)"' "$EXECUTION_FILE" || true
          if [ ! -f .auto-review/review.md ]; then
            jq -r '[if type == "array" then .[] else . end | select(.type? == "result")] | last | "subtype=\(.subtype // "none") turns=\(.num_turns // "none") is_error=\(.is_error | tostring)", (.result // "no result message")[0:4000]' "$EXECUTION_FILE" || true
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claude-review
          # Only the files publish reads: the review target and anything else stay on the runner.
          path: |
            .auto-review/review.md
            .auto-review/comments.json
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  publish:
    name: Publish Claude review
    needs: [gate, review]
    if: always() && needs.gate.outputs.review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      statuses: write
    env:
      REPO: ${{ github.repository }}
      REVIEWER: yngwald
      NUMBER: ${{ needs.gate.outputs.number }}
      HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
      MARKER: '<!-- claude-review sha=${{ needs.gate.outputs.head_sha }} -->'
      CONTEXT: Claude review
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BODY_FILE: review-out/review.md
      COMMENTS_FILE: review-out/comments.json
      # The body as posted: the agent's body with the reason cut from the Next step line.
      POST_FILE: review-out/post.md
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: claude-review
          path: review-out

      # Runs with GITHUB_TOKEN and owns the status; the artifact exists only when the review job succeeded.
      # always(): after a workflow-level cancel a step without a status check is skipped, and the
      # pending status this run's gate set would never resolve.
      - id: validate
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          REVIEW_RESULT: ${{ needs.review.result }}
          VERSION: ${{ needs.review.outputs.version }}
        run: |
          post_status() {
            gh api "repos/$REPO/statuses/$HEAD_SHA" -f state="$1" -f description="$2" \
              -f context="$CONTEXT" -f target_url="$RUN_URL" > /dev/null
          }
          summary_section() {
            tr -d '\r' < "$BODY_FILE" | awk '/^<details>/ {skip = 1} /^<\/details>/ {skip = 0; next} skip {next}
              /^### / {on = ($0 ~ /^### Summary[[:space:]]*$/); seen = 1; next} on || !seen'
          }

          # Only the run whose gate set the latest status reports: an older run must not overwrite a
          # newer gate's status. Accepted trade-off (AGENTS.md): a workflow_dispatch run and an
          # event-driven run for the same head share only the review job's group, so one review cancels
          # the other, and when the cancelled one belongs to the status owner that head gets no review.
          # A failed read leaves no status behind otherwise, so it reports an error under this run's URL.
          latest=$(gh api "repos/$REPO/commits/$HEAD_SHA/status?per_page=100" \
            --jq '[.statuses[] | select(.context == env.CONTEXT)][0].target_url // ""') \
            || { post_status error "Could not read the Claude review status"; exit 1; }
          [ "$latest" = "$RUN_URL" ] || { echo "Status owned by another run: ${latest:-none}"; exit 0; }
          if [ "$JOB_STATUS" = cancelled ]; then
            post_status error "Claude review was cancelled"
            exit 0
          fi

          if [ ! -f "$BODY_FILE" ]; then
            if [ "$REVIEW_RESULT" = cancelled ]; then
              # The review job's per-PR group cancels an older head's review when a newer one starts.
              head=$(gh api "repos/$REPO/pulls/$NUMBER" --jq .head.sha) \
                || { post_status error "Could not read the PR head"; exit 1; }
              [ "$head" = "$HEAD_SHA" ] || { post_status error "Superseded by a newer head"; exit 0; }
              post_status error "Claude review was cancelled"
              exit 0
            fi
            post_status failure "Claude review failed before writing a review"
            exit 1
          fi

          head=$(gh api "repos/$REPO/pulls/$NUMBER" --jq .head.sha) \
            || { post_status error "Could not read the PR head"; exit 1; }
          [ "$head" = "$HEAD_SHA" ] || { post_status error "Superseded by a newer head"; exit 0; }

          fail() { post_status failure "$1"; exit 1; }
          [[ "$VERSION" =~ ^[0-9][0-9.]*$ ]] || fail "No cr-request version from the review job"
          [ "$(head -n 1 "$BODY_FILE" | tr -d '\r')" = "$MARKER" ] || fail "The review body does not start with the marker"
          # The signature with the duration the review job appended, then the full `Next step` line
          # (cr-request 0.0.6+). A signature as the very last line is the order before 0.0.6, for a
          # REVIEW_SKILLS_REF override.
          tail2=$(tr -d '\r' < "$BODY_FILE" | grep -v '^[[:space:]]*$' | tail -n 2 | sed 's/[[:space:]]*$//' || true)
          prev=$(head -n 1 <<< "$tail2")
          last=$(tail -n 1 <<< "$tail2")
          signature_re="^Reviewed with: \`/cr-request\` ${VERSION//./\\.} skill · In [0-9]+ min [0-9]+ sec\$"
          # Accepted trade-off (AGENTS.md): the footer regexes have no CI test; check edits on sample bodies.
          next_re="^Next step: (\`/[a-z0-9-]+( [^\`[:space:]]+)*\`( -> \`/[a-z0-9-]+\`( [a-z0-9-]+)?)?( · [^[:space:]].*)?|none( · [^[:space:]].*)?)\$"
          if [[ "$prev" =~ $signature_re ]] && [[ "$last" =~ $next_re ]]; then
            signature="$prev"
          elif [[ "$last" =~ $signature_re ]]; then
            signature="$last"
          else
            fail "The review body does not end with the signature and Next step lines"
          fi
          # The Next step line loses the reason after ` · ` (the chain and findings forms have none, so they
          # stay whole) and sits right under the signature with no blank line between (GitHub renders the
          # line break). A blank line goes before the footer: right after `</details>` it would join that
          # HTML block raw.
          pair=0
          [ "$signature" = "$last" ] || pair=1
          awk -v pair="$pair" '
            { sub(/\r$/, "") }
            NR == FNR { if ($0 !~ /^[[:space:]]*$/) { prev = last; last = FNR } next }
            FNR == (pair ? prev : last) && before !~ /^[[:space:]]*$/ { print "" }
            pair && FNR > prev && FNR < last { next }
            pair && FNR == last { sub(/ · .*/, "") }
            { print; before = $0 }
          ' "$BODY_FILE" "$BODY_FILE" > "$POST_FILE"
          # GitHub rejects review bodies over 65536 characters; bytes are the stricter bound.
          [ "$(wc -c < "$POST_FILE")" -le 65536 ] || fail "The review body is longer than GitHub accepts"
          [ -f "$COMMENTS_FILE" ] || echo '[]' > "$COMMENTS_FILE"
          jq -e 'type == "array" and length <= 30 and all(.[]; type == "object" and (keys == ["body", "line", "path"])
            and (.path | type == "string") and (.line | type == "number" and . >= 1 and floor == .)
            and (.body | type == "string" and length > 0 and length <= 8000))' "$COMMENTS_FILE" > /dev/null \
            || fail "The inline comments file is malformed"
          if grep -qE '(ghp_|ghs_|gho_|ghu_|ghr_|github_pat_|sk-ant-|sb_secret_)[A-Za-z0-9]' "$POST_FILE" "$COMMENTS_FILE"; then
            fail "Review body or comments contain a token-like string"
          fi

          # The one-row Summary table: its header, the separator, then the data row.
          header_re='^\| *Intent *\| *System *\| *Craft *\| *Critical *\| *Important *\| *Minor *\|$'
          verdict='(PASS|FINDINGS|UNASSESSED)'
          row_re="^\| *$verdict *\| *$verdict *\| *$verdict *\| *([0-9]+) *\| *([0-9]+) *\| *([0-9]+) *\|\$"
          section=$(summary_section | sed 's/[[:space:]]*$//')
          row=$(grep -A 2 -E "$header_re" <<< "$section" | sed -n 3p || true)
          [[ "$row" =~ $row_re ]] || fail "The review has no valid Summary table"
          critical="${BASH_REMATCH[4]}"
          important="${BASH_REMATCH[5]}"
          minor="${BASH_REMATCH[6]}"
          readiness=$(grep -oE '\*\*Readiness:\*\* *(ready with fixes|not ready|ready)' <<< "$section" \
            | sed -E 's/.*\*\* *//' | head -n 1 || true)
          [ -n "$readiness" ] || fail "The review has no merge readiness"

          summary="Critical $critical, Important $important, Minor $minor; $readiness"
          state=success
          if [ "$critical" -gt 0 ] || [ "$readiness" = "not ready" ]; then state=failure; fi
          {
            echo "ready_to_post=true"
            echo "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "signature=$signature"
            echo "summary=$summary"
            echo "state=$state"
          } >> "$GITHUB_OUTPUT"

      # The only step with the yngwald PAT: it checks the token's owner and posts the validated body
      # and inline comments as is. Inline comments count in the PR list's comment counter; a review
      # body alone does not. When GitHub refuses the comments (HTTP 422, a line outside its diff), the
      # body goes alone; any other failure, a timeout that may have posted included, posts nothing more.
      - id: post
        if: steps.validate.outputs.ready_to_post == 'true'
        env:
          GH_TOKEN: ${{ secrets.YNGWALD_PR_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::YNGWALD_PR_TOKEN is not set"; exit 1; }
          login="$(gh api user --jq .login)"
          test "$login" = "$REVIEWER" || { echo "::error::YNGWALD_PR_TOKEN belongs to '$login', not $REVIEWER"; exit 1; }
          payload="$(mktemp)"
          jq -n --arg commit "$HEAD_SHA" --rawfile body "$POST_FILE" --slurpfile comments "$COMMENTS_FILE" \
            '{commit_id: $commit, event: "COMMENT", body: $body, comments: ($comments[0] | map(. + {side: "RIGHT"}))}' \
            > "$payload"
          err="$(mktemp)"
          if ! id=$(gh api -X POST "repos/$REPO/pulls/$NUMBER/reviews" --input "$payload" --jq .id 2> "$err"); then
            cat "$err" >&2
            grep -q 'HTTP 422' "$err" && [ "$(jq length "$COMMENTS_FILE")" -gt 0 ] || exit 1
            echo "::warning::GitHub refused the review with inline comments; posting the body alone"
            id=$(gh api -X POST "repos/$REPO/pulls/$NUMBER/reviews" -f commit_id="$HEAD_SHA" -f event=COMMENT \
              -F body=@"$POST_FILE" --jq .id)
          fi
          echo "review_id=$id" >> "$GITHUB_OUTPUT"

      - name: Report review status
        if: always() && steps.validate.outputs.ready_to_post == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          POST_OUTCOME: ${{ steps.post.outcome }}
          REVIEW_ID: ${{ steps.post.outputs.review_id }}
          SIGNATURE: ${{ steps.validate.outputs.signature }}
          SUMMARY: ${{ steps.validate.outputs.summary }}
          STATE: ${{ steps.validate.outputs.state }}
          VALIDATED_AT: ${{ steps.validate.outputs.validated_at }}
          JOB_STATUS: ${{ job.status }}
        run: |
          post_status() {
            gh api "repos/$REPO/statuses/$HEAD_SHA" -f state="$1" -f description="$2" \
              -f context="$CONTEXT" -f target_url="$RUN_URL" > /dev/null
          }
          # A run cancelled by a newer one keeps its hands off the status the newer gate set.
          latest=$(gh api "repos/$REPO/commits/$HEAD_SHA/status?per_page=100" \
            --jq '[.statuses[] | select(.context == env.CONTEXT)][0].target_url // ""') \
            || { post_status error "Could not read the Claude review status"; exit 1; }
          [ "$latest" = "$RUN_URL" ] || { echo "Status owned by another run: ${latest:-none}"; exit 0; }
          # A cancel may cut the post step short after the POST landed. Only then look the review up, and
          # only among reviews submitted after this run validated its body, so an earlier review of the
          # same head never stands in for one this run failed to post.
          if [ "$POST_OUTCOME" = cancelled ] && [ -z "$REVIEW_ID" ]; then
            ids=$(gh api --paginate "repos/$REPO/pulls/$NUMBER/reviews" \
              --jq '.[] | select(.user.login == env.REVIEWER and .commit_id == env.HEAD_SHA
                and .submitted_at >= env.VALIDATED_AT and (.body | contains(env.MARKER))) | .id') \
              || { post_status error "Could not read the PR reviews"; exit 1; }
            REVIEW_ID=$(tail -n 1 <<< "$ids")
          elif [ "$POST_OUTCOME" != success ]; then
            REVIEW_ID=""
          fi
          if [ -z "$REVIEW_ID" ] && [ "$JOB_STATUS" = cancelled ]; then
            post_status error "Claude review was cancelled"
            exit 0
          fi
          if [ -z "$REVIEW_ID" ]; then
            post_status failure "Posting the review failed"
            exit 1
          fi
          posted=$(gh api "repos/$REPO/pulls/$NUMBER/reviews/$REVIEW_ID" \
            --jq '.user.login == env.REVIEWER and .commit_id == env.HEAD_SHA
              and (.body | contains(env.MARKER)) and (.body | contains(env.SIGNATURE))') \
            || { post_status error "Could not read the posted review"; exit 1; }
          [ "$posted" = true ] || { post_status failure "Posted review not found"; exit 1; }
          post_status "$STATE" "$SUMMARY"

      # A step that failed before setting a final status, a transient API error for example.
      - name: Report an unexpected failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$REPO/commits/$HEAD_SHA/status?per_page=100" \
            --jq '[.statuses[] | select(.context == env.CONTEXT)][0] | "\(.target_url) \(.state)"')
          [ "$current" = "$RUN_URL pending" ] || exit 0
          gh api "repos/$REPO/statuses/$HEAD_SHA" -f state=error -f description="Publishing the review failed" \
            -f context="$CONTEXT" -f target_url="$RUN_URL" > /dev/null
