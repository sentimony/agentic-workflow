name: Claude review

# Posts one cr-request PR review as yngwald on each open, non-draft, same-repo PR whose head has a
# green CI run, once per head SHA, and again when yngwald is requested as a reviewer. The agent
# reviews with a read-only GITHUB_TOKEN and writes the body to a file; the publish job validates it,
# and only its `post` step gets the yngwald PAT. That holds for the main copy of this file:
# pull_request runs use the PR branch's copy, so anyone who can push a branch can reach the PAT.
# The checks cover the body's structure and token-like strings, not its prose; the `Claude review`
# status is advisory, not a required check.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  # A PR opened, reopened, or marked ready after its CI went green gets no new CI run.
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number
        required: true

permissions: {}

jobs:
  gate:
    name: Review gate
    # Failed CI runs pass too: the gate turns a pending request's status into `error` and skips.
    if: github.event.action != 'review_requested' || github.event.requested_reviewer.login == 'yngwald'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      review: ${{ steps.gate.outputs.review }}
      number: ${{ steps.gate.outputs.number }}
      base_sha: ${{ steps.gate.outputs.base_sha }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REVIEWER: yngwald
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          EVENT_PR: ${{ github.event.pull_request.number || inputs.pr_number }}
          CONTEXT: Claude review
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          post_status() {
            gh api "repos/$REPO/statuses/$head_sha" -f state="$1" -f description="$2" \
              -f context="$CONTEXT" -f target_url="$RUN_URL" > /dev/null
          }

          skip() {
            echo "Skip: $1" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "review=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # For skips that end a requested review: a "waiting for green CI" status would stay pending.
          skip_final() {
            waiting=$(gh api "repos/$REPO/commits/$head_sha/statuses" \
              --jq '[.[] | select(.context == env.CONTEXT)][0] | select(.state == "pending")
                | (.description // "") | startswith("Review requested; waiting")')
            [ "$waiting" != true ] || post_status error "Not reviewed: $1"
            skip "$1"
          }

          if [ -n "$RUN_SHA" ]; then
            [ "$RUN_HEAD_REPO" = "$REPO" ] || skip "CI run from a fork"
            # CI runs on push, so its run carries no PR; find the open PR by commit.
            number=$(gh api "repos/$REPO/commits/$RUN_SHA/pulls" \
              --jq "[.[] | select(.state == \"open\" and .head.sha == \"$RUN_SHA\")][0].number // empty")
          else
            number="$EVENT_PR"
          fi
          [ -z "$number" ] || [[ "$number" =~ ^[0-9]+$ ]] || skip "invalid PR number '$number'"
          [ -n "$number" ] || skip "no open PR for $RUN_SHA"

          pr=$(gh api "repos/$REPO/pulls/$number")
          head_sha=$(jq -r .head.sha <<< "$pr")
          base_sha=$(jq -r .base.sha <<< "$pr")
          [ "$(jq -r .state <<< "$pr")" = open ] || skip_final "PR #$number is not open"
          [ "$(jq -r .draft <<< "$pr")" = false ] || skip_final "PR #$number is a draft"
          [ "$(jq -r .head.repo.full_name <<< "$pr")" = "$REPO" ] || skip "PR #$number is from a fork"
          [ "$(jq -r .user.type <<< "$pr")" != Bot ] || skip_final "PR #$number is from a bot"
          [ "$(jq -r .user.login <<< "$pr")" != "$REVIEWER" ] || skip_final "PR #$number is by $REVIEWER"
          jq -e '.labels | map(.name) | index("skip-auto-review") | not' <<< "$pr" > /dev/null \
            || skip_final "PR #$number has the skip-auto-review label"
          [ -z "$RUN_SHA" ] || [ "$RUN_SHA" = "$head_sha" ] || skip "PR #$number moved on from $RUN_SHA"
          requested=$(jq --arg r "$REVIEWER" '[.requested_reviewers[].login] | index($r) != null' <<< "$pr")

          # Runs are listed newest first; the per-workflow endpoint answers 404 until ci.yml has run.
          ci=$(gh api "repos/$REPO/actions/runs?head_sha=$head_sha&event=push" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")][0]
              | if . == null then "none" elif .status != "completed" then .status else .conclusion end')
          if [ "$ci" != success ]; then
            if [ "$requested" = true ]; then
              case "$ci" in
                none|queued|in_progress|waiting|requested|pending)
                  post_status pending "Review requested; waiting for green CI" ;;
                *) post_status error "Review requested; CI is $ci, the review waits for a green run" ;;
              esac
            fi
            skip "CI on $head_sha is $ci"
          fi

          # A pending review request asks for a fresh pass even when this SHA was already reviewed.
          if [ "$requested" != true ]; then
            # Captured first, so grep -q never closes a gh pipe early; one call per assignment, so either
            # call failing fails the step.
            reviews=$(gh api --paginate "repos/$REPO/pulls/$number/reviews" \
              --jq ".[] | select(.user.login == \"$REVIEWER\") | .body")
            comments=$(gh api --paginate "repos/$REPO/issues/$number/comments" \
              --jq ".[] | select(.user.login == \"$REVIEWER\") | .body")
            if grep -qF "<!-- claude-review sha=$head_sha -->" <<< "$reviews"$'\n'"$comments"; then
              skip_final "PR #$number already has a review of $head_sha"
            fi
          fi

          post_status pending "Claude review in progress"

          echo "Review PR #$number at $head_sha" | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo "review=true"
            echo "number=$number"
            echo "base_sha=$base_sha"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"

  review:
    name: Claude review
    needs: gate
    if: needs.gate.outputs.review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-review-${{ needs.gate.outputs.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    # The agent can write the body file, so publish takes the version from here, not the artifact.
    outputs:
      version: ${{ steps.skill.outputs.version }}
    env:
      NUMBER: ${{ needs.gate.outputs.number }}
      HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
      # sentimony/agentic-workflow commit of tag v0.0.4 with plugins/awf/skills/cr-request; the
      # reviewer skill comes from a released tag, never from the PR head under review.
      CR_REQUEST_REF: a5cf04b2d5d72d6fa624bdb46223f1ada6a2047a
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      # The agent gets no git diff, log, or show: they accept --output=<path>, which could write
      # outside .auto-review/. The target is prepared here and handed over as files instead.
      - name: Prepare review target
        # bash -eo pipefail: a failing git diff feeding the base-copy loop must fail the step.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.gate.outputs.base_sha }}
        run: |
          out=.auto-review/target
          # The path is reserved: a PR that tracks anything under it, symlinks included, fails here.
          # rm -rf then clears only untracked leftovers, and every write below lands in a fresh directory.
          if [ -n "$(git ls-files .auto-review)" ]; then
            echo "::error::.auto-review/ is reserved for the review job; remove it from the PR"
            exit 1
          fi
          rm -rf .auto-review
          mkdir -p "$out/base"
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          {
            echo "Repository root: $GITHUB_WORKSPACE ($GITHUB_REPOSITORY)"
            echo "Branch or worktree: detached checkout of PR #$NUMBER"
            echo "Boundary: range"
            echo "Base: $BASE_SHA"
            echo "Effective base: $merge_base"
            echo "Head: $HEAD_SHA"
            echo "Tree: $(git rev-parse "$HEAD_SHA^{tree}")"
            echo "Included paths: every path in stat.txt"
            echo "Excluded paths and reason: none"
            echo "Uncommitted state: none"
            echo "Captured at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$out/identity.txt"
          git log --format='%h %H %s' "$merge_base..$HEAD_SHA" > "$out/log.txt"
          # The agent has no gh: gh --jq can read its environment.
          gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json title,body,author,reviews,comments > "$out/pr.json"
          git diff --no-ext-diff --no-textconv --stat "$merge_base" "$HEAD_SHA" > "$out/stat.txt"
          git diff --no-ext-diff --no-textconv "$merge_base" "$HEAD_SHA" > "$out/diff.patch"
          # Base copies of modified, deleted, and type-changed files; the checkout holds the head side.
          git diff -z --name-only --no-renames --diff-filter=MDT "$merge_base" "$HEAD_SHA" |
            while IFS= read -r -d '' path; do
              mkdir -p "$out/base/$(dirname -- "$path")"
              git show "$merge_base:$path" > "$out/base/$path"
            done
          test -s "$out/diff.patch" || { echo "::error::empty diff for $merge_base..$HEAD_SHA"; exit 1; }

      # User scope: .claude/ is gitignored, and the action restores it from the base branch.
      - name: Install cr-request skill
        id: skill
        run: |
          git init -q "$RUNNER_TEMP/awf"
          git -C "$RUNNER_TEMP/awf" fetch -q --depth 1 https://github.com/sentimony/agentic-workflow "$CR_REQUEST_REF"
          git -C "$RUNNER_TEMP/awf" checkout -q FETCH_HEAD
          mkdir -p ~/.claude/skills .auto-review
          cp -R "$RUNNER_TEMP/awf/plugins/awf/skills/cr-request" ~/.claude/skills/
          test -f ~/.claude/skills/cr-request/SKILL.md
          version="$(sed -nE 's/^[[:space:]]+version:[[:space:]]*"?([0-9][0-9.]*)"?[[:space:]]*$/\1/p' ~/.claude/skills/cr-request/SKILL.md | head -n 1)"
          test -n "$version" || { echo "::error::No version in the cr-request SKILL.md"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1
        id: claude
        with:
          # Read-only token: the agent reads the PR but cannot write to GitHub.
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # User-scope setting: Read, Grep, Glob, and file-reading Bash commands outside the working
          # directory are refused; Claude Code keeps ~/.claude/skills readable.
          settings: '{"permissions":{"blockReadsOutsideWorkingDirectories":true}}'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ needs.gate.outputs.number }}
            BASE SHA: ${{ needs.gate.outputs.base_sha }}
            HEAD SHA: ${{ needs.gate.outputs.head_sha }}

            Run the cr-request skill for this pull request on a prepared target. The target is the
            committed range from the merge base of BASE SHA and HEAD SHA to HEAD SHA, already captured in
            .auto-review/target/: identity.txt (the target identity, tree included), log.txt
            (`<short sha> <full sha> <subject>` per commit), stat.txt, diff.patch, base/ with the
            merge-base copies of modified, deleted, and type-changed files, and pr.json with the PR title,
            description, reviews, and comments. The checkout is HEAD SHA. git diff, git log, git show, and gh
            are not available; read these files instead, and pass the same instruction to any reviewer you
            dispatch. Intent: the PR title and description from pr.json, plus AGENTS.md. There is no plan
            file and no journal to write.
            CI (skill frontmatter, manifests and marketplaces, README versions, hidden Unicode) is green on HEAD SHA; tests were not run in this job - say so in the gaps.
            Earlier reviews and comments on the PR are context; label this a fresh review pass when the same
            reviewer already reviewed an older head.

            If the cr-request skill is not available to you, do not review and do not write
            .auto-review/review.md; stop and report that the skill is missing.

            Write exactly one pull request review body in English, with plain hyphens only, to
            .auto-review/review.md; do not write or edit any other file. Do not post it; a later step posts
            it as a review that neither approves nor requests changes. The body must start with this exact line:
            <!-- claude-review sha=${{ needs.gate.outputs.head_sha }} -->
            then the target identity, the reviewed range, the commits in it, and the coverage (files read,
            what was skipped), then a `### Summary` section with two Markdown tables and one line.

            Write the reviewed range as a compare link with short SHAs, followed by the number of files and lines:
            [`<base7>...<head7>`](https://github.com/${{ github.repository }}/compare/<BASE SHA>...<HEAD SHA>)
            Take the number of files and lines from the last line of .auto-review/target/stat.txt.
            List the commits from .auto-review/target/log.txt, one line each, as
            - [`<short sha>`](https://github.com/${{ github.repository }}/commit/<full sha>) <subject>
            After 20 commits write `and <n> more`.

            The Summary section:

            | Axis | Verdict |
            | --- | --- |
            | Intent | PASS, FINDINGS, or UNASSESSED |
            | System | PASS, FINDINGS, or UNASSESSED |
            | Craft | PASS, FINDINGS, or UNASSESSED |

            | Severity | Count |
            | --- | --- |
            | Critical | <n> |
            | Important | <n> |
            | Minor | <n> |

            **Merge readiness:** ready, ready with fixes, or not ready - <one line>

            Use only the severities Critical, Important, and Minor; the counts must match the findings, and zero
            findings means zeros. After the summary: the findings with severity, confidence, file:line, impact,
            and evidence, optional suggestions, the set-aside list, open questions, and review gaps.
            In the skill's closing `Next step` line, write the skill name as inline code with a leading slash, for
            example: Next step: `/cr-received` - 2 findings to rule on. Leave `none` as plain text.
            Never copy a token or secret into the body. The line below replaces the skill's default
            `Reviewed with: cr-request skill` closing line; the `Next step` line goes right before it, and the
            body must end with it, backticks included:
            Reviewed with: `/cr-request` ${{ steps.skill.outputs.version }} skill
          # Reads stay in the workspace and the installed skill, so injected PR text cannot steer the agent
          # to runner files or /proc and copy the OAuth token into the body. Grep and Glob follow the Read
          # rules (Glob(path) rules never match); Write follows the Edit rule for the body file.
          claude_args: >-
            --model ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-opus-5-5' }}
            --max-turns 60
            --allowedTools "Skill,Agent,Task,Read(./**),Read(~/.claude/skills/**),Edit(./.auto-review/review.md),Write(./.auto-review/review.md),Bash(git merge-base:*),Bash(git rev-parse:*),Bash(git status:*),Bash(git ls-files:*)"

      # The action hides the agent's output: list the paths it read and the calls the permission rules
      # refused (paths and commands only), and the result when it wrote no body.
      - name: Show file access and why no review was written
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          [ -f "$EXECUTION_FILE" ] || exit 0
          echo "Read and search paths:"
          jq -r '[if type == "array" then .[] else . end | select(.type? == "assistant") | .message.content[]?
            | select(.type? == "tool_use" and (.name == "Read" or .name == "Grep" or .name == "Glob"))
            | "\(.name) \(.input.file_path // .input.path // "." )"] | unique[]' "$EXECUTION_FILE" || true
          echo "Permission denials:"
          jq -r '[if type == "array" then .[] else . end | select(.type? == "result")] | last
            | (.permission_denials // [])[] | "\(.tool_name) \(.tool_input.file_path // .tool_input.path // (.tool_input.command // "" | .[0:160]))"' "$EXECUTION_FILE" || true
          [ -f .auto-review/review.md ] && exit 0
          echo "::warning::The agent finished without .auto-review/review.md; its result follows"
          jq -r '[if type == "array" then .[] else . end | select(.type? == "result")] | last | "subtype=\(.subtype // "none") turns=\(.num_turns // "none") is_error=\(.is_error | tostring)", (.result // "no result message")[0:4000]' "$EXECUTION_FILE" || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claude-review
          # Only the file publish reads: the review target and anything else stay on the runner.
          path: .auto-review/review.md
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  publish:
    name: Publish Claude review
    needs: [gate, review]
    if: always() && needs.gate.outputs.review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      statuses: write
    env:
      REPO: ${{ github.repository }}
      REVIEWER: yngwald
      NUMBER: ${{ needs.gate.outputs.number }}
      HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
      MARKER: '<!-- claude-review sha=${{ needs.gate.outputs.head_sha }} -->'
      CONTEXT: Claude review
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BODY_FILE: review-out/review.md
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: claude-review
          path: review-out

      # Runs with GITHUB_TOKEN and owns the status; the artifact exists only when the review job succeeded.
      - id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_RESULT: ${{ needs.review.result }}
          VERSION: ${{ needs.review.outputs.version }}
        run: |
          post_status() {
            gh api "repos/$REPO/statuses/$HEAD_SHA" -f state="$1" -f description="$2" \
              -f context="$CONTEXT" -f target_url="$RUN_URL" > /dev/null
          }
          summary_section() {
            tr -d '\r' < "$BODY_FILE" | awk '/^### /{on = ($0 ~ /^### Summary[[:space:]]*$/); next} on'
          }
          count() {
            summary_section | grep -oE "^\| *$1 *\| *[0-9]+ *\|" | grep -oE '[0-9]+' | head -n 1 || true
          }

          # An older run must not overwrite the status a newer gate set; a status from an older run
          # does not stop this one.
          owner=$(gh api "repos/$REPO/commits/$HEAD_SHA/statuses" \
            --jq '[.[] | select(.context == env.CONTEXT)][0].target_url // "" | capture("/runs/(?<id>[0-9]+)$").id // "0"')
          [ "${owner:-0}" -le "$GITHUB_RUN_ID" ] || { echo "Status owned by a newer run"; exit 0; }

          if [ ! -f "$BODY_FILE" ]; then
            if [ "$REVIEW_RESULT" = cancelled ]; then
              post_status error "Claude review was cancelled"
              exit 0
            fi
            post_status failure "Claude review failed before writing a review"
            exit 1
          fi

          head=$(gh api "repos/$REPO/pulls/$NUMBER" --jq .head.sha)
          [ "$head" = "$HEAD_SHA" ] || { post_status error "Superseded by a newer head"; exit 0; }

          fail() { post_status failure "$1"; exit 1; }
          [[ "$VERSION" =~ ^[0-9][0-9.]*$ ]] || fail "No cr-request version from the review job"
          [ "$(head -n 1 "$BODY_FILE" | tr -d '\r')" = "$MARKER" ] || fail "The review body does not start with the marker"
          last=$(tr -d '\r' < "$BODY_FILE" | grep -v '^[[:space:]]*$' | tail -n 1 | sed 's/[[:space:]]*$//' || true)
          [ "$last" = "Reviewed with: \`/cr-request\` $VERSION skill" ] || fail "The review body does not end with the signature line"
          if grep -qE '(ghp_|ghs_|gho_|ghu_|ghr_|github_pat_|sk-ant-|sb_secret_)[A-Za-z0-9]' "$BODY_FILE"; then
            fail "Review body contains a token-like string"
          fi
          critical=$(count Critical)
          important=$(count Important)
          minor=$(count Minor)
          readiness=$(summary_section | grep -oE '\*\*Merge readiness:\*\* *(ready with fixes|not ready|ready)' \
            | sed -E 's/.*\*\* *//' | head -n 1 || true)
          if [ -z "$critical" ] || [ -z "$important" ] || [ -z "$minor" ] || [ -z "$readiness" ]; then
            fail "The review has no Summary counts or merge readiness"
          fi

          summary="Critical $critical, Important $important, Minor $minor; $readiness"
          state=success
          if [ "$critical" -gt 0 ] || [ "$readiness" = "not ready" ]; then state=failure; fi
          {
            echo "ready_to_post=true"
            echo "signature=Reviewed with: \`/cr-request\` $VERSION skill"
            echo "summary=$summary"
            echo "state=$state"
          } >> "$GITHUB_OUTPUT"

      # The only step with the yngwald PAT: it checks the token's owner and posts the body as is.
      - id: post
        if: steps.validate.outputs.ready_to_post == 'true'
        env:
          GH_TOKEN: ${{ secrets.YNGWALD_PR_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::YNGWALD_PR_TOKEN is not set"; exit 1; }
          login="$(gh api user --jq .login)"
          test "$login" = "$REVIEWER" || { echo "::error::YNGWALD_PR_TOKEN belongs to '$login', not $REVIEWER"; exit 1; }
          id=$(gh api -X POST "repos/$REPO/pulls/$NUMBER/reviews" -f commit_id="$HEAD_SHA" -f event=COMMENT \
            -F body=@"$BODY_FILE" --jq .id)
          echo "review_id=$id" >> "$GITHUB_OUTPUT"

      - name: Report review status
        if: always() && steps.validate.outputs.ready_to_post == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          POST_OUTCOME: ${{ steps.post.outcome }}
          REVIEW_ID: ${{ steps.post.outputs.review_id }}
          SIGNATURE: ${{ steps.validate.outputs.signature }}
          SUMMARY: ${{ steps.validate.outputs.summary }}
          STATE: ${{ steps.validate.outputs.state }}
        run: |
          post_status() {
            gh api "repos/$REPO/statuses/$HEAD_SHA" -f state="$1" -f description="$2" \
              -f context="$CONTEXT" -f target_url="$RUN_URL" > /dev/null
          }
          if [ "$POST_OUTCOME" != success ] || [ -z "$REVIEW_ID" ]; then
            post_status failure "Posting the review failed"
            exit 1
          fi
          posted=$(gh api "repos/$REPO/pulls/$NUMBER/reviews/$REVIEW_ID" \
            --jq '.user.login == env.REVIEWER and .commit_id == env.HEAD_SHA
              and (.body | contains(env.MARKER)) and (.body | contains(env.SIGNATURE))')
          [ "$posted" = true ] || { post_status failure "Posted review not found"; exit 1; }
          owner=$(gh api "repos/$REPO/commits/$HEAD_SHA/statuses" \
            --jq '[.[] | select(.context == env.CONTEXT)][0].target_url // "" | capture("/runs/(?<id>[0-9]+)$").id // "0"')
          [ "${owner:-0}" -le "$GITHUB_RUN_ID" ] || { echo "Review posted; status owned by a newer run"; exit 0; }
          post_status "$STATE" "$SUMMARY"

      # A step that failed before setting a final status, a transient API error for example.
      - name: Report an unexpected failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$REPO/commits/$HEAD_SHA/statuses" \
            --jq '[.[] | select(.context == env.CONTEXT)][0] | "\(.target_url) \(.state)"')
          [ "$current" = "$RUN_URL pending" ] || exit 0
          gh api "repos/$REPO/statuses/$HEAD_SHA" -f state=error -f description="Publishing the review failed" \
            -f context="$CONTEXT" -f target_url="$RUN_URL" > /dev/null
