name: Claude review

# Posts one cr-request review comment as yngwald on each open, non-draft, same-repo PR whose head
# has a green CI run, once per head SHA. Claude itself gets only a read-only token and writes
# the review to a file; a separate step posts it with the yngwald PAT.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  # A PR opened, reopened, or marked ready after its CI went green gets no new CI run.
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number
        required: true

permissions: {}

jobs:
  gate:
    name: Review gate
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      review: ${{ steps.gate.outputs.review }}
      number: ${{ steps.gate.outputs.number }}
      base_sha: ${{ steps.gate.outputs.base_sha }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REVIEWER: yngwald
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          EVENT_PR: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          skip() {
            echo "Skip: $1" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "review=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ -n "$RUN_SHA" ]; then
            [ "$RUN_HEAD_REPO" = "$REPO" ] || skip "CI run from a fork"
            # CI runs on push, so its run carries no PR; find the open PR by commit.
            number=$(gh api "repos/$REPO/commits/$RUN_SHA/pulls" \
              --jq "[.[] | select(.state == \"open\" and .head.sha == \"$RUN_SHA\")][0].number // empty")
          else
            number="$EVENT_PR"
          fi
          [ -z "$number" ] || [[ "$number" =~ ^[0-9]+$ ]] || skip "invalid PR number '$number'"
          [ -n "$number" ] || skip "no open PR for $RUN_SHA"

          pr=$(gh api "repos/$REPO/pulls/$number")
          head_sha=$(jq -r .head.sha <<< "$pr")
          base_sha=$(jq -r .base.sha <<< "$pr")
          [ "$(jq -r .state <<< "$pr")" = open ] || skip "PR #$number is not open"
          [ "$(jq -r .draft <<< "$pr")" = false ] || skip "PR #$number is a draft"
          [ "$(jq -r .head.repo.full_name <<< "$pr")" = "$REPO" ] || skip "PR #$number is from a fork"
          [ "$(jq -r .user.type <<< "$pr")" != Bot ] || skip "PR #$number is from a bot"
          [ "$(jq -r .user.login <<< "$pr")" != "$REVIEWER" ] || skip "PR #$number is by $REVIEWER"
          jq -e '.labels | map(.name) | index("skip-auto-review") | not' <<< "$pr" > /dev/null \
            || skip "PR #$number has the skip-auto-review label"
          [ -z "$RUN_SHA" ] || [ "$RUN_SHA" = "$head_sha" ] || skip "PR #$number moved on from $RUN_SHA"

          # Runs are listed newest first; the per-workflow endpoint answers 404 until ci.yml has run.
          ci=$(gh api "repos/$REPO/actions/runs?head_sha=$head_sha&event=push" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")][0]
              | if . == null then "none" elif .status != "completed" then .status else .conclusion end')
          [ "$ci" = success ] || skip "CI on $head_sha is $ci"

          # Captured first: under pipefail, grep -q closing the pipe early would fail gh with SIGPIPE.
          bodies=$(gh api --paginate "repos/$REPO/issues/$number/comments" \
            --jq ".[] | select(.user.login == \"$REVIEWER\") | .body")
          if grep -qF "<!-- claude-review sha=$head_sha -->" <<< "$bodies"; then
            skip "PR #$number already has a review of $head_sha"
          fi

          echo "Review PR #$number at $head_sha" | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo "review=true"
            echo "number=$number"
            echo "base_sha=$base_sha"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"

  review:
    name: Claude review
    needs: gate
    if: needs.gate.outputs.review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-review-${{ needs.gate.outputs.number }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      # Read-only, for the agent's gh calls; the post step overrides it.
      GH_TOKEN: ${{ github.token }}
      REVIEWER: yngwald
      NUMBER: ${{ needs.gate.outputs.number }}
      HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
      # sentimony/agentic-workflow commit of tag v0.0.1 with plugins/awf/skills/cr-request; the
      # reviewer skill comes from a released tag, never from the PR head under review. Bump it to
      # the v0.0.2 tag commit after release: 0.0.1 lacks the prepared target mode.
      CR_REQUEST_REF: 39626fcce7cadd6a77b1cf5ebc6b0ce922f37960
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      # The agent gets no git diff, log, or show: they accept --output=<path>, which could write
      # outside .auto-review/. The target is prepared here and handed over as files instead.
      - name: Prepare review target
        env:
          BASE_SHA: ${{ needs.gate.outputs.base_sha }}
        run: |
          out=.auto-review/target
          # The path is reserved: a PR that tracks anything under it, symlinks included, fails here.
          # rm -rf then clears only untracked leftovers, and every write below lands in a fresh directory.
          if [ -n "$(git ls-files .auto-review)" ]; then
            echo "::error::.auto-review/ is reserved for the review job; remove it from the PR"
            exit 1
          fi
          rm -rf .auto-review
          mkdir -p "$out/base"
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          {
            echo "Repository root: $GITHUB_WORKSPACE ($GITHUB_REPOSITORY)"
            echo "Branch or worktree: detached checkout of PR #$NUMBER"
            echo "Boundary: range"
            echo "Base: $BASE_SHA"
            echo "Effective base: $merge_base"
            echo "Head: $HEAD_SHA"
            echo "Included paths: every path in stat.txt"
            echo "Excluded paths and reason: none"
            echo "Uncommitted state: none"
            echo "Captured at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$out/identity.txt"
          git log --oneline "$merge_base..$HEAD_SHA" > "$out/log.txt"
          git diff --no-ext-diff --no-textconv --stat "$merge_base" "$HEAD_SHA" > "$out/stat.txt"
          git diff --no-ext-diff --no-textconv "$merge_base" "$HEAD_SHA" > "$out/diff.patch"
          # Base copies of modified, deleted, and type-changed files; the checkout holds the head side.
          git diff -z --name-only --no-renames --diff-filter=MDT "$merge_base" "$HEAD_SHA" |
            while IFS= read -r -d '' path; do
              mkdir -p "$out/base/$(dirname -- "$path")"
              git show "$merge_base:$path" > "$out/base/$path"
            done
          test -s "$out/diff.patch" || { echo "::error::empty diff for $merge_base..$HEAD_SHA"; exit 1; }

      # User scope: .claude/ is gitignored, and the action restores it from the base branch.
      - name: Install cr-request skill
        run: |
          git init -q "$RUNNER_TEMP/awf"
          git -C "$RUNNER_TEMP/awf" fetch -q --depth 1 https://github.com/sentimony/agentic-workflow "$CR_REQUEST_REF"
          git -C "$RUNNER_TEMP/awf" checkout -q FETCH_HEAD
          mkdir -p ~/.claude/skills .auto-review
          cp -R "$RUNNER_TEMP/awf/plugins/awf/skills/cr-request" ~/.claude/skills/
          test -f ~/.claude/skills/cr-request/SKILL.md

      - uses: anthropics/claude-code-action@867ab36a6fa36ec00845704bc92d95ae20a817b1 # v1
        with:
          # Read-only token: the agent reads the PR but cannot write to GitHub.
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ needs.gate.outputs.number }}
            BASE SHA: ${{ needs.gate.outputs.base_sha }}
            HEAD SHA: ${{ needs.gate.outputs.head_sha }}

            Run the cr-request skill for this pull request on a prepared target. The target is the
            committed range from the merge base of BASE SHA and HEAD SHA to HEAD SHA, already captured in
            .auto-review/target/: identity.txt, log.txt, stat.txt, diff.patch, and base/ with the merge-base
            copies of modified, deleted, and type-changed files. The checkout is HEAD SHA. git diff, git log, and git show
            are not available; read these files instead, and pass the same instruction to any reviewer you
            dispatch. Intent: the PR title and description from `gh pr view`, plus AGENTS.md.
            CI (skill frontmatter, manifests and marketplaces, README versions, hidden Unicode) is green on HEAD SHA; tests were not run in this job - say so in the gaps.
            Earlier review comments on the PR are context; label this a fresh review pass when the same
            reviewer already reviewed an older head.

            If the cr-request skill is not available to you, do not review and do not write
            .auto-review/comment.md; stop and report that the skill is missing.

            Output: write only the final review comment, in English with hyphens only, to
            .auto-review/comment.md. It must hold the target identity, the Intent, System, and Craft
            verdicts, the findings with severity, confidence, file:line, impact and evidence, optional
            suggestions, the set-aside list, open questions, review gaps, and merge readiness.
            The comment must end with the line `Reviewed with: cr-request skill`.
            Do not edit any other file, post comments, push, or merge.
          claude_args: >-
            --model ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-opus-5-5' }}
            --max-turns 60
            --allowedTools "Skill,Agent,Task,Read,Glob,Grep,Write(./.auto-review/**),Edit(./.auto-review/**),Bash(git merge-base:*),Bash(git rev-parse:*),Bash(git status:*),Bash(git ls-files:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*)"

      - name: Post review as yngwald
        id: post
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWER_TOKEN: ${{ secrets.YNGWALD_PR_TOKEN }}
        run: |
          test -s .auto-review/comment.md || { echo "::error::the review produced no comment"; exit 1; }
          last="$(tr -d '\r' < .auto-review/comment.md | grep -v '^[[:space:]]*$' | tail -n 1 | sed 's/[[:space:]]*$//' || true)"
          [ "$last" = 'Reviewed with: cr-request skill' ] \
            || { echo "::error::the comment was not made with the cr-request skill"; exit 1; }
          # The comment author is the PAT owner; refuse to post as anyone else.
          test -n "$REVIEWER_TOKEN" || { echo "::error::YNGWALD_PR_TOKEN is not set"; exit 1; }
          login="$(GH_TOKEN="$REVIEWER_TOKEN" gh api user --jq .login)"
          test "$login" = "$REVIEWER" || { echo "::error::YNGWALD_PR_TOKEN belongs to '$login', not $REVIEWER"; exit 1; }
          # The PR may have moved on while the review ran; a stale pass is not published.
          current="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq '.head.sha')"
          [ "$current" = "$HEAD_SHA" ] || { echo "Skip: PR #$NUMBER moved on to $current"; exit 0; }
          # Another run may have reviewed this SHA after the gate passed.
          bodies=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
            --jq ".[] | select(.user.login == \"$REVIEWER\") | .body")
          if grep -qF "<!-- claude-review sha=$HEAD_SHA -->" <<< "$bodies"; then
            echo "Skip: PR #$NUMBER already has a review of $HEAD_SHA"
            exit 0
          fi
          {
            printf '<!-- claude-review sha=%s -->\n' "$HEAD_SHA"
            cat .auto-review/comment.md
          } > "$RUNNER_TEMP/body.md"
          GH_TOKEN="$REVIEWER_TOKEN" gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
          echo "posted=true" >> "$GITHUB_OUTPUT"

      - name: Verify review comment
        if: steps.post.outputs.posted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One comment must carry both this SHA's marker and the skill line.
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
            --jq ".[] | select(.user.login == \"$REVIEWER\") | select(.body | contains(\"<!-- claude-review sha=$HEAD_SHA -->\") and contains(\"Reviewed with: cr-request skill\")) | .id")
          [ -n "$ids" ] || { echo "::error::no $REVIEWER review comment made with the cr-request skill"; exit 1; }
